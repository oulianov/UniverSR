[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "universr"
version = "0.1.0"
description = "Unified and Versatile Audio Super-Resolution via Vocoder-Free Flow Matching"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Woongjib Choi"},
]
keywords = ["audio", "super-resolution", "flow-matching", "speech", "music"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.0",
    "torchaudio>=2.0",
    "torchdiffeq>=0.2.3",
    "einops>=0.7",
    "timm>=0.9",
    "huggingface_hub>=0.20",
    "pyyaml>=6.0",
    "soundfile>=0.12",
]

[project.optional-dependencies]
train = [
    "librosa>=0.10",
    "matplotlib>=3.7",
    "python-box>=7.0",
    "transformers>=4.30",
    "wandb>=0.15",
    "torchinfo>=1.8",
    "tqdm>=4.60",
]
all = ["universr[train]"]

[project.urls]
Homepage = "https://github.com/woongzip1/UniverSR"
Paper = "https://arxiv.org/abs/2510.00771"
Demo = "https://woongzip1.github.io/universr-demo/"

[tool.setuptools.packages.find]
include = ["universr*"]
